name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  LEFTHOOK: "0"

jobs:
  check:
    name: Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check registry artifacts
        run: bun run registry:check

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
